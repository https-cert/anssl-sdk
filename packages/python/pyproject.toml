[project]
name = "anssl"
version = "0.1.0"
description = "Official Python SDK for the ANSSL certificate lifecycle API"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "ANSSL"}]
readme = "README.md"
keywords = ["ANSSL", "certificate", "ACME", "SDK"]
requires-python = ">=3.11"
dependencies = [
  "urllib3>=2.1,<3",
  "python-dateutil>=2.8.2",
  "pydantic>=2.11",
  "typing-extensions>=4.7.1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.urls]
Repository = "https://github.com/https-cert/anssl-sdk"
Documentation = "https://anssl.cn/open-platform"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
